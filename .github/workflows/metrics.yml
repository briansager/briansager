name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "assets/**"

permissions:
  contents: write

concurrency:
  group: update-github-stats
  cancel-in-progress: true

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download GitHub Readme Stats
        run: |
          git clone --depth 1 \
            https://github.com/anuraghazra/github-readme-stats.git \
            /tmp/github-readme-stats

      - name: Install dependencies
        working-directory: /tmp/github-readme-stats
        run: |
          npm install
          npm install express

      - name: Start stats server
        working-directory: /tmp/github-readme-stats
        env:
          PAT_1: ${{ secrets.METRICS_TOKEN }}
          PORT: 9000
        run: |
          node express.js > /tmp/stats-server.log 2>&1 &
          echo $! > /tmp/stats-server.pid

      - name: Wait for stats server
        run: |
          for i in {1..60}; do
            if curl --silent --fail \
              "http://localhost:9000/api?username=briansager" \
              > /dev/null; then
              echo "Stats server is ready."
              exit 0
            fi

            sleep 1
          done

          echo "Stats server failed to start."
          echo "Server log:"
          cat /tmp/stats-server.log
          exit 1

      - name: Generate GitHub stats card
        run: |
          mkdir -p assets

          curl --fail --silent --show-error --retry 3 \
            "http://localhost:9000/api?username=briansager&show_icons=true&theme=tokyonight&count_private=true" \
            -o assets/stats.svg

          test -s assets/stats.svg

      - name: Commit updated stats card
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update GitHub stats"
          file_pattern: "assets/stats.svg"
